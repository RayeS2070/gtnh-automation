components_manager:
    task_processors:
        main-task-processor:
            worker_threads: $worker-threads
        fs-task-processor:
            worker_threads: $worker-fs-threads
    default_task_processor: main-task-processor

    components:
        # Our middlewares after userver's: compression wraps the handler's answer.
        default-server-middleware-pipeline-builder:
            append:
              - compression

        server:
            listener:
                port: $server-port
                task_processor: main-task-processor

        logging:
            fs-task-processor: fs-task-processor
            loggers:
                default:
                    file_path: '@stderr'
                    level: $logger-level
                    format: $logger-format
                    overflow_behavior: discard

        # Values that change while the server runs: config::kPoll and the others
        # in src/config/dynamic.hpp, and userver's own. The defaults are below and
        # in the code; the file of dynamic-config-file-updater goes over them.
        dynamic-config:
            updates-enabled: true
            defaults:
                # handler-static answers HTTP 500 for a file type missing here.
                USERVER_FILES_CONTENT_TYPE_MAP:
                    .html: "text/html; charset=utf-8"
                    .js: "text/javascript"
                    .css: "text/css"
                    .json: "application/json"
                    .svg: "image/svg+xml"
                    .png: "image/png"
                    .webp: "image/webp"
                    .ico: "image/x-icon"
                    .txt: "text/plain; charset=utf-8"
                    .map: "application/json"
                    .woff2: "font/woff2"
                    .bin: "application/octet-stream"
                # Our queries take milliseconds, but a COMMIT waits for fsync, which on the
                # dev machine's btrfs sometimes takes over a second: with userver's 750 ms
                # the poll failed with HTTP 500 (4 of 1209 polls). A timeout on COMMIT also
                # leaves its outcome unknown: orders sent in it would never reach the agent.
                POSTGRES_DEFAULT_COMMAND_CONTROL:
                    network_timeout_ms: 5000
                    statement_timeout_ms: 3000

        dynamic-config-file-updater:
            path: $dynamic-config-path
            update-period: 5s
            fs-task-processor: fs-task-processor

        testsuite-support: {}

        dns-client:
            fs-task-processor: fs-task-processor

        postgres-db:
            dbconnection: $db-connection
            dbconnection#env: FACTORYCTL_DB
            blocking_task_processor: fs-task-processor
            dns_resolver: async
            sync-start: true
            # One server: no need for the watchdog that shares connection
            # limits through a u_clients table.
            connlimit_mode: manual

        schema: {}

        events-cleanup: {}

        handler-ping:
            path: /ping
            method: GET
            task_processor: main-task-processor
            throttling_enabled: false

        handler-health:
            path: /health
            method: GET
            task_processor: main-task-processor

        handler-agent-scan:
            path: /agent/v1/scan
            method: POST
            task_processor: main-task-processor

        handler-agent-poll:
            path: /agent/v1/poll
            method: POST
            task_processor: main-task-processor

        handler-agent-pumps-poll:
            path: /agent/v1/pumps/poll
            method: POST
            task_processor: main-task-processor

        handler-api-pumps:
            path: /api/v1/pumps
            method: GET
            task_processor: main-task-processor

        handler-api-pump-settings:
            path: /api/v1/pumps/settings
            method: PUT
            task_processor: main-task-processor

        handler-api-pump-target:
            path: /api/v1/pumps/targets/{fluid}
            method: PUT,DELETE
            task_processor: main-task-processor

        handler-agent-qft-poll:
            path: /agent/v1/qft/poll
            method: POST
            task_processor: main-task-processor

        handler-api-qft:
            path: /api/v1/qft
            method: GET
            task_processor: main-task-processor

        handler-agent-mining-poll:
            path: /agent/v1/mining/poll
            method: POST
            task_processor: main-task-processor

        handler-api-mining:
            path: /api/v1/mining
            method: GET
            task_processor: main-task-processor

        handler-api-mining-target:
            path: /api/v1/mining/targets/{goods_id}
            method: PUT,DELETE
            task_processor: main-task-processor

        handler-api-mining-targets:
            path: /api/v1/mining/targets
            method: POST
            task_processor: main-task-processor

        handler-api-mining-ores:
            path: /api/v1/mining/ores
            method: GET
            task_processor: main-task-processor

        handler-api-mining-setup:
            path: /api/v1/mining/setups/{name}
            method: DELETE
            task_processor: main-task-processor

        handler-api-qft-settings:
            path: /api/v1/qft/{name}/settings
            method: PUT
            task_processor: main-task-processor

        handler-api-qft-setup:
            path: /api/v1/qft/{name}
            method: DELETE
            task_processor: main-task-processor

        handler-api-stock:
            path: /api/v1/stock
            method: GET
            task_processor: main-task-processor

        handler-api-targets:
            path: /api/v1/targets
            method: GET
            task_processor: main-task-processor

        handler-api-target:
            path: /api/v1/targets/{goods_id}
            method: PUT,DELETE
            task_processor: main-task-processor

        handler-api-target-groups:
            path: /api/v1/target-groups
            method: GET,POST
            task_processor: main-task-processor

        handler-api-target-group:
            path: /api/v1/target-groups/{group_id}
            method: PUT,DELETE
            task_processor: main-task-processor

        handler-api-orders:
            path: /api/v1/orders
            method: GET,POST
            task_processor: main-task-processor

        handler-api-order-cancel:
            path: /api/v1/orders/{order_id}/cancel
            method: POST
            task_processor: main-task-processor

        handler-api-cpus:
            path: /api/v1/cpus
            method: GET
            task_processor: main-task-processor

        handler-api-events:
            path: /api/v1/events
            method: GET
            task_processor: main-task-processor

        handler-api-me:
            path: /api/v1/me
            method: GET
            task_processor: main-task-processor

        # The web client: `npm run build` in factoryctl/web, served from web-dir.
        fs-cache-web:
            dir: $web-dir
            update-period: 10s
            fs-task-processor: fs-task-processor

        handler-static:
            fs-cache-component: fs-cache-web
            path: /*
            method: GET
            task_processor: main-task-processor

        # The icon atlas and the index that numbers the icons (tools/icons.py,
        # them (factoryctl/web/src/lib/icons.svelte.ts). Read once at startup.
        fs-cache-data:
            dir: $data-dir
            fs-task-processor: fs-task-processor

        handler-static-data:
            fs-cache-component: fs-cache-data
            path: /data/*
            method: GET
            task_processor: main-task-processor
