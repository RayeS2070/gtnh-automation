worker-threads: 2
worker-fs-threads: 1
logger-level: info
# json: one object per line (timestamp, level, module, text and tags), for jq; tskv is userver's
# own, raw is plain text.
logger-format: json
# 8081: 8080 is the deployed server's (live on this machine, prod on the game host).
server-port: 8081
# The development database from compose.yaml; FACTORYCTL_DB overrides it.
db-connection: postgresql://factoryctl:factoryctl@localhost:15432/factoryctl

# The dynamic config: periods, timeouts, scan parameters, read again while the
# server runs (a change applies within 5 s, no restart). Relative to where the
# server starts; no file is the defaults. Example: deploy/host_dynamic_config.yaml.
dynamic-config-path: dynamic_config.yaml

# The built web client (factoryctl/web: npm run build); relative to where the server starts.
web-dir: web/dist
# Item icons for the web client, built from an NEI dump by tools/icons.py.
data-dir: icons
