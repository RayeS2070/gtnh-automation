# factoryctl behind nginx: HTTPS and a password per person (auth_basic).
# Goes into the `http {}` block of the proxy's nginx.conf (include it or paste it).
#
# factoryctl keeps no accounts: nginx checks the person and passes the name on in
# X-Forwarded-User (orders and events show who did it; GET /api/v1/me tells the page).
# factoryctl trusts that header, so it must be reachable through this proxy only (it listens
# on 127.0.0.1 / the compose network) and nginx must set the header itself, never pass the
# client's.
#
# Passwords, one line per person (SHA-512 crypt; `openssl` needs no apache tools):
#   printf 'pavel:%s\n' "$(openssl passwd -6)" >> factoryctl.htpasswd
# nginx reads the file on every request: adding or removing a person needs no reload.
#
# The agents (OpenComputers in game) do not come through here: they post to the server
# directly (http://127.0.0.1:8090), so /agent/ is closed below.

upstream factoryctl_backend {
    # The `server` service of compose project factoryctl-live: nginx on its network
    # (factoryctl-live_default). nginx in another compose project: put it on that network,
    # or go through the host: host.docker.internal:8090 with
    # extra_hosts: ["host.docker.internal:host-gateway"].
    server server:8080;
    keepalive 16;
}

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name factoryctl.gtnh;

    ssl_certificate     /run/secrets/nginx_tls_cert;
    ssl_certificate_key /run/secrets/nginx_tls_key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # A self-signed certificate: with a long HSTS a mistake in it could not be clicked
    # through. Raise max-age once the certificate settles.
    add_header Strict-Transport-Security "max-age=300" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    auth_basic "factoryctl";
    auth_basic_user_file /run/secrets/factoryctl_htpasswd;

    # Every location below that proxies sets these; a location with its own
    # proxy_set_header would drop them all.
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-ID      $request_id;
    # Who it is: the name auth_basic checked, whatever the client sent.
    proxy_set_header X-Forwarded-User  $remote_user;
    # The password stays here: factoryctl has no use for it.
    proxy_set_header Authorization     "";
    # Keepalive to the upstream (no WebSocket in factoryctl).
    proxy_set_header Connection        "";

    location = /nginx-health {
        auth_basic off;
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The agents' protocol: not for browsers (a forged report or someone else's orders).
    location /agent/ {
        return 404;
    }

    # Icons (data.bin and the atlas, ~42 MB): factoryctl sends them with an `Expires` the
    # browser takes as stale, so every reload fetched them again. A day is enough.
    location /data/ {
        proxy_pass http://factoryctl_backend;
        proxy_hide_header Expires;
        # add_header here drops the server's ones: they are repeated.
        add_header Cache-Control "public, max-age=86400" always;
        add_header Strict-Transport-Security "max-age=300" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # The page and the API: GET, POST, PUT, DELETE (no limit_except: PUT and DELETE edit
    # targets, groups, pumps and QFT). Responses come compressed already: no gzip here.
    location / {
        proxy_pass http://factoryctl_backend;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
